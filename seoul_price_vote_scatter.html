var slope=0.00938448640648341,intc=38.601089141760646,xmin=586.8959976440137,xmax=4281.633355699813;
var line=[{x:xmin,y:slope*xmin+intc},{x:xmax,y:slope*xmax+intc}];
var labelSet=PTS.slice().sort(function(a,b){return b.x-a.x;}).slice(0,6).concat(PTS.slice().sort(function(a,b){return a.x-b.x;}).slice(0,4));
var labelKeys={};labelSet.forEach(function(p){labelKeys[p.gu+'|'+p.dong]=1;});
var lab={id:'lab',afterDatasetsDraw:function(ch){var ctx=ch.ctx;ctx.save();ctx.font='11px sans-serif';ctx.fillStyle='#333';
 [1,2].forEach(function(di){var ds=ch.data.datasets[di];if(!ds)return;var meta=ch.getDatasetMeta(di);
  meta.data.forEach(function(el,i){var pt=ds.data[i];var p=pt&&pt.p;if(p&&labelKeys[p.gu+'|'+p.dong]){ctx.fillText(p.gu+' '+p.dong,el.x+(el.options.radius||5)+3,el.y+3);}});});ctx.restore();}};
new Chart(document.getElementById('cv').getContext('2d'),{type:'bubble',data:{datasets:[
 {type:'line',label:'추세선',data:line,borderColor:'#888',borderWidth:1.5,borderDash:[5,4],pointRadius:0,fill:false,order:3},
 {label:'정원오',data:bluePts,backgroundColor:'rgba(47,111,208,0.7)',borderColor:blue,borderWidth:0.5,order:1},
 {label:'오세훈',data:redPts,backgroundColor:'rgba(210,59,54,0.7)',borderColor:red,borderWidth:0.5,order:1}]},
 options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
  tooltip:{callbacks:{label:function(c){var p=c.raw&&c.raw.p;if(!p)return'';return [p.gu+' '+p.dong+' (법정동 '+p.bd+')','㎡당 '+p.x.toLocaleString()+'만 (평당 '+p.pyeong.toLocaleString()+'만)','오세훈 '+p.y+'% · 정원오 '+p.m+'%','투표자 '+p.valid.toLocaleString()+'명 · 거래 약 '+p.n.toLocaleString()+'건'];}}}},
  scales:{x:{title:{display:true,text:'㎡당 중위 실거래가 (만원)'},grid:{color:'#eee'}},y:{title:{display:true,text:'오세훈 양자 득표율 (%)'},grid:{color:'#eee'}}}},plugins:[lab]});
</script></body></html>
